[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "z-agent-core"
version = "0.2.4"
description = "Chinese-first agent runtime with agentic context management"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
dependencies = [
  "cryptography>=45,<47",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jieba>=0.42,<1",
  "opencc>=1.1.9,<2",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.scripts]
zagent = "zagent.cli:main"
zagent-server = "zagent.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zagent = ["extensions/*.cjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["zagent"]
branch = true
omit = ["src/zagent/extensions/python_host.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
