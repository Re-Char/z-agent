name: Release desktop build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: base
          auto-activate: true

      - name: Validate release version
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected_tag"

      - name: Install build dependencies
        run: |
          npm ci
          conda install --yes --name base --channel conda-forge conda-pack

      - name: Build relocatable Core and UI
        run: |
          ZAGENT_CONDA_PACK="$(conda info --base)/bin/conda-pack" npm run build:core
          npm run build:ui

      - name: Package unsigned DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package -w @zagent/desktop -- --mac dmg --arm64 --publish never

      - name: Verify bundled Core and disk image
        run: |
          test -x dist/desktop/mac-arm64/Z-Agent.app/Contents/Resources/core-runtime/bin/python
          dist/desktop/mac-arm64/Z-Agent.app/Contents/Resources/core-runtime/bin/python \
            -c "import fastapi, jieba, opencc, uvicorn, zagent; print(zagent.__version__)"
          hdiutil verify dist/desktop/Z-Agent-*-arm64.dmg

      - name: Create source archive, SBOM and checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="z-agent-$GITHUB_REF_NAME/" \
            --output="dist/desktop/Z-Agent-$version-source.tar.gz" "$GITHUB_SHA"
          npm sbom --sbom-format cyclonedx \
            > "dist/desktop/Z-Agent-$version-npm-sbom.cdx.json"
          cd dist/desktop
          shasum -a 256 \
            Z-Agent-*-arm64.dmg \
            Z-Agent-*-arm64.dmg.blockmap \
            latest-mac.yml \
            Z-Agent-*-source.tar.gz \
            Z-Agent-*-npm-sbom.cdx.json \
            > SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/desktop/Z-Agent-*-arm64.dmg \
              dist/desktop/Z-Agent-*-arm64.dmg.blockmap dist/desktop/latest-mac.yml \
              dist/desktop/Z-Agent-*-source.tar.gz \
              dist/desktop/Z-Agent-*-npm-sbom.cdx.json \
              dist/desktop/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/desktop/Z-Agent-*-arm64.dmg \
              dist/desktop/Z-Agent-*-arm64.dmg.blockmap dist/desktop/latest-mac.yml \
              dist/desktop/Z-Agent-*-source.tar.gz \
              dist/desktop/Z-Agent-*-npm-sbom.cdx.json \
              dist/desktop/SHA256SUMS.txt --verify-tag --generate-notes \
              --notes "Unsigned macOS build: Apple Developer ID signing/notarization is intentionally skipped. The app bundles its own Python Core; macOS may require manual approval on first launch."
          fi
