name: Release v0.2.0

on:
  push:
    tags:
      - v0.2.0

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build UI and arm64 DMG
        run: |
          npm run build:ui
          npm run package -w @zagent/desktop -- --mac dmg --arm64

      - name: Create source archive and checksums
        run: |
          git archive --format=tar.gz --prefix=z-agent-v0.2.0/ --output=dist/desktop/Z-Agent-0.2.0-source.tar.gz "$GITHUB_SHA"
          cd dist/desktop
          shasum -a 256 Z-Agent-0.2.0-arm64.dmg Z-Agent-0.2.0-arm64.dmg.blockmap Z-Agent-0.2.0-source.tar.gz > SHA256SUMS.txt

      - name: Write release notes
        run: |
          printf '%s\n' \
            'Z-Agent v0.2.0 是 v2 开发预发布版本。' \
            '' \
            '本版新增：独立 Python/Node Extension Host、逐次 Permission Broker、MCP Streamable HTTP/OAuth、官方 MCP Registry remote 导入、CycloneDX 扩展 SBOM、本机 Ed25519 安装签名，以及 macOS/Linux OS 沙箱后端。' \
            '' \
            '验证：154 个 Python 测试、80.95% 分支覆盖率、12 个前端测试、Ruff、TypeScript、Vite 构建和 DMG 校验通过。' \
            '' \
            '重要限制：此 DMG 未使用 Apple Developer ID 签名或公证，当前也尚未内置完整可重定位 Python runtime，因此标记为 prerelease，仅用于开发验收，不建议在干净机器或生产环境分发。' \
            > release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/desktop/Z-Agent-0.2.0-arm64.dmg \
              dist/desktop/Z-Agent-0.2.0-arm64.dmg.blockmap \
              dist/desktop/Z-Agent-0.2.0-source.tar.gz \
              dist/desktop/SHA256SUMS.txt \
              --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Z-Agent v0.2.0" --notes-file release-notes.md --prerelease
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/desktop/Z-Agent-0.2.0-arm64.dmg \
              dist/desktop/Z-Agent-0.2.0-arm64.dmg.blockmap \
              dist/desktop/Z-Agent-0.2.0-source.tar.gz \
              dist/desktop/SHA256SUMS.txt \
              --verify-tag \
              --title "Z-Agent v0.2.0" \
              --notes-file release-notes.md \
              --prerelease
          fi
