name: One-time v0.1.0 and v0.1.1 releases

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.1.1.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        release:
          - version: 0.1.0
            title: Z-Agent v0.1.0
          - version: 0.1.1
            title: Z-Agent v0.1.1 — V1 长程任务验收版
    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and checkout release tag
        shell: bash
        run: |
          release_version="${{ matrix.release.version }}"
          release_tag="v${release_version}"
          git rev-parse --verify "refs/tags/${release_tag}"
          package_version="$(git show "${release_tag}:apps/desktop/package.json" | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data).version));")"
          test "${package_version}" = "${release_version}"
          git checkout --detach "${release_tag}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:ui

      - name: Build macOS arm64 DMG
        run: npm run package -w @zagent/desktop -- --arm64

      - name: Create archive and checksums
        shell: bash
        run: |
          release_version="${{ matrix.release.version }}"
          release_tag="v${release_version}"
          git archive --format=tar.gz --prefix="z-agent-${release_version}/" \
            --output="dist/desktop/Z-Agent-${release_version}-source.tar.gz" "${release_tag}"
          cd dist/desktop
          shasum -a 256 \
            "Z-Agent-${release_version}-arm64.dmg" \
            "Z-Agent-${release_version}-arm64.dmg.blockmap" \
            "Z-Agent-${release_version}-source.tar.gz" > SHA256SUMS.txt

      - name: Create or replace GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_version="${{ matrix.release.version }}"
          release_tag="v${release_version}"
          assets=(
            "dist/desktop/Z-Agent-${release_version}-arm64.dmg"
            "dist/desktop/Z-Agent-${release_version}-arm64.dmg.blockmap"
            "dist/desktop/Z-Agent-${release_version}-source.tar.gz"
            dist/desktop/SHA256SUMS.txt
          )
          if gh release view "${release_tag}" >/dev/null 2>&1; then
            gh release upload "${release_tag}" "${assets[@]}" --clobber
          else
            gh release create "${release_tag}" "${assets[@]}" \
              --verify-tag \
              --title "${{ matrix.release.title }}" \
              --generate-notes
          fi
