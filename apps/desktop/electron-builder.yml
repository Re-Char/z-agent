appId: com.zagent.desktop
productName: Z-Agent
artifactName: ${productName}-${version}-${arch}.${ext}
afterSign: build/notarize.cjs
directories:
  output: ../../dist/desktop
files:
  - main.cjs
  - preload.cjs
  - package.json
  - from: ../ui/dist
    to: ui
extraResources:
  - from: ../../dist/core-runtime
    to: core-runtime
mac:
  category: public.app-category.developer-tools
  target: dmg
  icon: build/icon-1024.png
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
win:
  target: nsis
linux:
  target: AppImage
publish:
  provider: github
  owner: Re-Char
  repo: z-agent
  releaseType: release
